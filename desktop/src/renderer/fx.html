<!doctype html><html><head><meta charset="utf-8"><title>Assistant FX</title><style>
html,body{margin:0;background:transparent;overflow:hidden;font:15px/1.4 "Inter","Segoe UI",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh}
#draw{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:rgba(0,0,0,.27);--ca:#8af}
#draw.on{opacity:1}
#draw .sv{position:absolute;left:12vw;width:76vw;top:14vh;height:55vh}
#draw svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--ca) 70%,transparent)) drop-shadow(0 1px 2px rgba(0,0,0,.65))}
#draw svg *{stroke-linecap:round;stroke-linejoin:round} #draw svg text{paint-order:stroke;stroke:rgba(0,0,0,.75);stroke-width:5px}
#dtitle{position:absolute;left:0;right:0;top:7vh;text-align:center;color:#fff;font-size:26px;font-weight:600;letter-spacing:.01em;text-shadow:0 2px 10px rgba(0,0,0,.8)}
#dcap{position:absolute;left:12vw;right:12vw;top:71vh;text-align:center;color:#fff;font-size:21px;line-height:1.35;text-shadow:0 2px 10px rgba(0,0,0,.85);opacity:0;transition:opacity .5s}
#dot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;opacity:0;transition:opacity .25s;box-shadow:0 0 0 3px color-mix(in srgb,var(--ca) 55%,transparent),0 0 14px 6px color-mix(in srgb,var(--ca) 75%,transparent),0 0 34px 12px color-mix(in srgb,var(--ca) 35%,transparent)}
</style></head><body><canvas id="c"></canvas>
<div id="draw"><div id="dtitle"></div><div class="sv" id="sv"></div><div id="dcap"></div>
<div id="dot"></div></div>
<script src="common.js"></script><script src="fx.js"></script></body></html>
