<!doctype html><html><head><meta charset="utf-8"><title>Assistant FX</title><style>
html,body{margin:0;background:transparent;overflow:hidden;font:15px/1.4 "Inter","Segoe UI",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh}
#draw{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:rgba(0,0,0,.4)} #draw.on{opacity:1}
#draw .sv{position:absolute;left:4vw;width:92vw;top:calc(46vh - 33vh);height:66vh} #draw svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 3px rgba(0,0,0,.85))}
#dtitle{position:absolute;left:0;right:0;top:calc(46vh - 33vh - 46px);text-align:center;color:#fff;font-size:24px;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#dcap{position:absolute;left:8vw;right:8vw;top:calc(46vh + 34vh);text-align:center;color:#fff;font-size:20px;text-shadow:0 2px 8px rgba(0,0,0,.85);opacity:0;transition:opacity .4s}
#cur{position:absolute;width:26px;height:30px;left:0;top:0;opacity:0;transition:opacity .2s;filter:drop-shadow(0 0 6px var(--ca,#8af))}
</style></head><body><canvas id="c"></canvas>
<div id="draw"><div id="dtitle"></div><div class="sv" id="sv"></div><div id="dcap"></div>
<svg id="cur" viewBox="0 0 26 30"><path d="M2 2 L2 24 L8 18.5 L12.5 28 L16 26.4 L11.6 17.4 L19.5 17 Z" fill="#fff" stroke="var(--ca,#8af)" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<script src="common.js"></script><script src="fx.js"></script></body></html>
