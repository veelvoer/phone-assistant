<!doctype html><html><head><meta charset="utf-8"><title>Assistant</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app">
  <aside id="side"><div class="brand"><img src="../../assets/icon-256.png" alt=""><div><b>Assistant</b><span id="statusLine"><i id="dot"></i><em id="statusText">Ready</em></span></div></div><nav id="nav"></nav><div class="sidefoot" id="ver"></div></aside>
  <main id="content">
    <section id="page-home" class="page on">
      <div id="update" class="card upd" hidden><div class="row"><div class="grow"><b id="updT"></b><p id="updN" class="hint"></p></div><div class="row"><button id="updPage" class="tonal">Notes</button><button id="updB" class="filled">Update now</button></div></div><div id="updBar" class="bar" hidden><i></i></div></div>
      <div id="warnings"></div>
      <div class="card ask"><textarea id="task" rows="3" placeholder="What should I do on your computer?"></textarea>
        <div class="chips"><span class="chip">Open Firefox and search lofi on YouTube</span><span class="chip">How much disk space is free?</span><span class="chip">Explain how DNS works with a drawing</span></div>
        <div class="row"><button id="mic" class="tonal round" title="Talk"></button><button id="run" class="filled grow"></button></div>
        <p class="hint center">Shortcut <b id="hk"></b> · <code>assistant --toggle</code></p></div>
      <div class="stats"><div><span>Today</span><b id="sToday">–</b></div><div><span>Credits left</span><b id="sLeft">–</b></div><div><span>Last task</span><b id="sLast">–</b></div></div>
      <div class="card" id="planCard" hidden><h3>Plan</h3><div id="plan"></div><div class="row"><input id="planIn" placeholder="Change the plan… (or just say it)"><button id="planSend" class="tonal">Send</button></div></div>
      <div class="card"><div class="row"><h3 class="grow">Activity</h3><button id="clear" class="link">Clear</button></div><pre id="log"></pre></div>
    </section>
  </main>
</div>
<div id="toast"></div>
<script src="common.js"></script><script src="app.js"></script></body></html>
