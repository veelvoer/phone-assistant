name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Signing key
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
        env: { KEYSTORE_B64: '${{ secrets.KEYSTORE_B64 }}' }
      - run: gradle --no-daemon assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      - run: cp app/build/outputs/apk/release/app-release.apk phone-assistant.apk
      - uses: actions/upload-artifact@v4
        with: { name: phone-assistant, path: phone-assistant.apk }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: phone-assistant.apk }
